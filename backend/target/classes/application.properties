# ---------- F3 Kitchen API ----------
server.port=8080
spring.application.name=f3-kitchen-api

# Database: an H2 file in ./data (no install needed). See application-mysql.properties for MySQL.
spring.datasource.url=jdbc:h2:file:./data/f3kitchen;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Admin login for /admin — CHANGE THE PASSWORD before going live (or set APP_ADMIN_PASSWORD).
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:f3kitchen@123}

# Frontend dev server(s) allowed to call the API from the browser
app.cors-origins=${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.timezone=Asia/Kolkata
